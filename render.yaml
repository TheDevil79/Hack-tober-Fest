services:
  - type: web
    name: securex-labs
    runtime: node
    plan: free
    region: oregon
    branch: feature/gemma-auth-ui
    autoDeploy: true
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: patchlens
      - key: MONGODB_TIMEOUT_MS
        value: 5000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.5-flash-lite
      - key: AI_PROVIDER
        value: gemma
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMMA_FALLBACK_MODELS
        value: gemma-4-31b-it
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: VECTOR_INDEX
        value: knowledge_vector_index
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SCAN_TIMEOUT_MS
        value: 30000
      - key: MAX_SCAN_CONCURRENCY
        value: 5
      - key: MAX_AI_CONCURRENCY
        value: 2
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_SESSION_TTL_SECONDS
        value: 28800
